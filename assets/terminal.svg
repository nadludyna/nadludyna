<rect width="520" height="112" rx="10" fill="#101510" stroke="#2A3A2A"/>
<circle cx="18" cy="16" r="5" fill="#FF5F57"/><circle cx="34" cy="16" r="5" fill="#FEBC2E"/><circle cx="50" cy="16" r="5" fill="#28C840"/>
<text x="260" y="21" text-anchor="middle" style="font-size:12px;fill:#6B7A6B">nadludyna@lublin: ~</text>
<g class="s0">
  <clipPath id="cp0"><rect class="k0" x="34" y="44" width="0" height="26"/></clipPath>
  <text x="16" y="62" class="p">$</text>
  <text x="34" y="62" clip-path="url(#cp0)"><tspan class="c">whoami</tspan></text>
  <text x="16" y="90" class="o0"><tspan class="r">→</tspan><tspan class="out"> curious tech tinkerer</tspan><tspan class="cur">▋</tspan></text>
</g>
<g class="s1">
  <clipPath id="cp1"><rect class="k1" x="34" y="44" width="0" height="26"/></clipPath>
  <text x="16" y="62" class="p">$</text>
  <text x="34" y="62" clip-path="url(#cp1)"><tspan class="c">cat</tspan><tspan class="a"> motto.txt</tspan></text>
  <text x="16" y="90" class="o1"><tspan class="r">→</tspan><tspan class="out"> automating the boring stuff</tspan><tspan class="cur">▋</tspan></text>
</g>
<g class="s2">
  <clipPath id="cp2"><rect class="k2" x="34" y="44" width="0" height="26"/></clipPath>
  <text x="16" y="62" class="p">$</text>
  <text x="34" y="62" clip-path="url(#cp2)"><tspan class="c">./build</tspan><tspan class="a"> --because-i-want-it</tspan></text>
  <text x="16" y="90" class="o2"><tspan class="r">→</tspan><tspan class="out"> tools that should exist</tspan><tspan class="cur">▋</tspan></text>
</g>
<g class="s3">
  <clipPath id="cp3"><rect class="k3" x="34" y="44" width="0" height="26"/></clipPath>
  <text x="16" y="62" class="p">$</text>
  <text x="34" y="62" clip-path="url(#cp3)"><tspan class="c">sudo make</tspan><tspan class="a"> life</tspan></text>
  <text x="16" y="90" class="o3"><tspan class="r">→</tspan><tspan class="out"> a bit better</tspan><tspan class="cur">▋</tspan></text>
</g>
</svg>